[project]
name = "auth0-oauth-client"
# Placeholder. The publication workflow runs `poetry version $TAG_NAME` to set the real version from the git tag.
version = "0.0.0"
description = "A Django-focused Auth0 integration providing automated OIDC flows, account linking, and so on."
authors = [
    {name = "Tinuvi", email = "no-reply@tinuvi.com"}
]
license = "MIT"
readme = "README.md"
packages = [
    { include = "auth0_oauth_client" },
]

[project.urls]
repository = "https://github.com/tinuvi/auth0-oauth-client"
"Bug Tracker" = "https://github.com/tinuvi/auth0-oauth-client/issues"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2.9"
requests = "^2.32.5"
pyjwt = "^2.7.0"
auth0-python = "^4.13.0"

[tool.poetry.group.dev.dependencies]
requests-mock = "*"
coverage = "*"
freezegun = "*"
pyrefly = "~=0.64"
ruff = "^0.15.2"
django-stubs = "~=6.0"
types-requests = "^2.33.0.20260408"
unittest-xml-reporting = "~=4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["samples", "scripts", ".github", "**/migrations"]

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "S", # flake8-bandit
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]
ignore = [
    "E501", # line too long, formatter will handle this
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"tests/__init__.py" = ["E402"]
"auth0_oauth_client/__init__.py" = ["F401"]
"auth0_oauth_client/errors.py" = ["S105"]

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1

[tool.pyrefly]
python-version = "3.14"
project-includes = ["auth0_oauth_client"]
project-excludes = [
    "**/migrations/**",
    "**/__pycache__",
    "**/*venv/**",
    "samples/**",
]
check-unannotated-defs = false
infer-return-types = "checked"
permissive-ignores = true

[tool.pyrefly.errors]
bad-override-param-name = false
